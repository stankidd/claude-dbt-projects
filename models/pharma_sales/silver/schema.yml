version: 2

models:
  - name: silver_sales_activity
    description: "Sales call activity enriched with physician, territory, and product detail — one row per call"
    columns:
      - name: call_id
        description: "Primary key — unique call identifier"
        tests:
          - unique
          - not_null
      - name: call_date
        description: "Date the sales call occurred"
      - name: rep_id
        description: "Sales rep who made the call"
        tests:
          - not_null
      - name: rep_name
        description: "Sales rep full name from territory master"
      - name: territory_id
        description: "Territory where the call occurred"
        tests:
          - not_null
      - name: territory_name
        description: "Territory name from territory master"
      - name: region
        description: "Geographic region of the territory"
      - name: district
        description: "Sales district within the region"
      - name: physician_id
        description: "Physician who was called on"
        tests:
          - not_null
      - name: physician_name
        description: "Physician full name from physician master"
      - name: specialty
        description: "Physician medical specialty"
      - name: tier
        description: "Physician prescribing potential tier"
      - name: product_id
        description: "Product detailed during the call"
        tests:
          - not_null
      - name: product_name
        description: "Product brand name"
      - name: therapeutic_area
        description: "Product therapeutic area"
      - name: is_specialty_product
        description: "True if the product is a specialty drug"
      - name: call_type
        description: "Type of call (Detail or Follow-up)"
      - name: call_outcome
        description: "Outcome of the sales call (Positive, Neutral, Negative)"
      - name: is_positive_call
        description: "True if call_outcome is Positive"
        tests:
          - not_null
      - name: samples_left
        description: "Number of samples left with the physician"
      - name: discussion_minutes
        description: "Duration of the product discussion in minutes"
      - name: follow_up_required
        description: "True if a follow-up call was scheduled"

  - name: silver_prescription_activity
    description: "Prescription outcomes enriched with physician, territory, and product detail — one row per prescription"
    columns:
      - name: rx_id
        description: "Primary key — unique prescription identifier"
        tests:
          - unique
          - not_null
      - name: rx_date
        description: "Date the prescription was written"
      - name: rep_id
        description: "Sales rep for the territory where the prescription was written"
        tests:
          - not_null
      - name: rep_name
        description: "Sales rep full name from territory master"
      - name: territory_id
        description: "Territory associated with this prescription"
        tests:
          - not_null
      - name: territory_name
        description: "Territory name from territory master"
      - name: region
        description: "Geographic region of the territory"
      - name: district
        description: "Sales district within the region"
      - name: physician_id
        description: "Physician who wrote the prescription"
        tests:
          - not_null
      - name: physician_name
        description: "Physician full name from physician master"
      - name: specialty
        description: "Physician medical specialty"
      - name: tier
        description: "Physician prescribing potential tier"
      - name: product_id
        description: "Product that was prescribed"
        tests:
          - not_null
      - name: product_name
        description: "Product brand name"
      - name: therapeutic_area
        description: "Product therapeutic area"
      - name: is_specialty_product
        description: "True if the product is a specialty drug"
      - name: quantity_units
        description: "Number of units prescribed"
      - name: total_revenue_usd
        description: "Total revenue generated by this prescription in USD"
        tests:
          - not_null
      - name: prescription_type
        description: "Whether this is a New or Refill prescription"
      - name: is_new_patient
        description: "True if this prescription is for a new patient"
        tests:
          - not_null
      - name: is_refill
        description: "True if prescription_type is Refill"
        tests:
          - not_null
