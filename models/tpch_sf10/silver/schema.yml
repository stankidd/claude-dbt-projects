version: 2

models:
  - name: sf10_silver_orders
    description: "SF10 orders enriched with customer and nation details"
    columns:
      - name: order_id
        description: "Unique order identifier"
        tests:
          - unique
          - not_null
      - name: customer_id
        description: "Customer identifier"
        tests:
          - not_null
      - name: customer_name
        description: "Customer name from bronze_customer"
      - name: market_segment
        description: "Customer market segment"
        tests:
          - not_null
      - name: nation_name
        description: "Nation name from bronze_nation"
      - name: order_status
        description: "Order status code"
      - name: order_date
        description: "Date order was placed"
      - name: order_priority
        description: "Order priority level"
      - name: total_price
        description: "Total order price"

  - name: sf10_silver_lineitem
    description: "SF10 line items enriched with part, supplier, and nation details"
    columns:
      - name: order_id
        description: "Foreign key to orders"
        tests:
          - not_null
      - name: line_number
        description: "Line item number within order"
        tests:
          - not_null
      - name: part_id
        description: "Foreign key to part"
      - name: part_name
        description: "Part name"
      - name: part_type
        description: "Part type/category"
      - name: brand
        description: "Part brand"
      - name: supplier_id
        description: "Foreign key to supplier"
      - name: supplier_name
        description: "Supplier name"
      - name: supplier_nation
        description: "Supplier nation name"
      - name: quantity
        description: "Quantity ordered"
      - name: extended_price
        description: "Line item extended price before discount"
      - name: discount
        description: "Discount fraction applied"
      - name: discounted_price
        description: "Extended price after discount"
        tests:
          - not_null
      - name: net_price
        description: "Price after discount and tax"
        tests:
          - not_null
      - name: is_returned
        description: "True if line item was returned"
      - name: is_late_shipment
        description: "True if ship_date exceeded commit_date"
      - name: ship_date
        description: "Actual ship date"
      - name: ship_mode
        description: "Shipping mode"

  - name: sf10_silver_supplier_performance
    description: "SF10 line items enriched with supplier, nation, and part data; includes derived performance metrics"
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - order_id
              - line_number
    columns:
      - name: order_id
        description: "Foreign key to orders"
        tests:
          - not_null
      - name: line_number
        description: "Line item number within order"
        tests:
          - not_null
      - name: supplier_id
        description: "Foreign key to supplier"
        tests:
          - not_null
      - name: supplier_name
        description: "Supplier name"
      - name: nation_name
        description: "Nation of the supplier"
        tests:
          - not_null
      - name: part_id
        description: "Foreign key to part"
      - name: part_type
        description: "Part type category"
        tests:
          - not_null
      - name: quantity
        description: "Quantity ordered"
      - name: extended_price
        description: "Line item extended price before discount"
      - name: discount
        description: "Discount fraction applied"
      - name: tax
        description: "Tax fraction applied"
      - name: net_price
        description: "Final price after discount and tax: extended_price * (1 - discount) * (1 + tax)"
        tests:
          - not_null
      - name: is_returned
        description: "True if return_flag = R"
        tests:
          - not_null
      - name: is_late_shipment
        description: "True if ship_date exceeded commit_date"
        tests:
          - not_null
      - name: days_late
        description: "Days between commit_date and ship_date for late shipments; NULL for on-time"
      - name: ship_date
        description: "Actual ship date"
      - name: commit_date
        description: "Committed delivery date"
