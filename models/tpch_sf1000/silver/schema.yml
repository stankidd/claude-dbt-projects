version: 2

models:
  - name: silver_orders
    description: "Orders enriched with customer name, market segment, and nation"
    config:
      materialized: table
      tags: ['silver']
    columns:
      - name: order_id
        description: "Unique order identifier"
        tests:
          - unique
          - not_null
      - name: customer_id
        description: "Foreign key to customer"
        tests:
          - not_null
      - name: customer_name
        description: "Customer name from customer table"
      - name: market_segment
        description: "Customer market segment"
        tests:
          - not_null
      - name: nation_name
        description: "Nation the customer belongs to"
      - name: order_status
        description: "Order status code"
      - name: order_date
        description: "Date the order was placed"
      - name: order_priority
        description: "Order priority level"
      - name: total_price
        description: "Total order price"

  - name: silver_lineitem
    description: "Line items enriched with part, supplier, and nation details; includes derived price and flag fields"
    config:
      materialized: table
      tags: ['silver']
    columns:
      - name: order_id
        description: "Foreign key to orders"
        tests:
          - not_null
      - name: line_number
        description: "Line number within the order"
        tests:
          - not_null
      - name: part_id
        description: "Foreign key to part"
      - name: part_name
        description: "Part name"
      - name: part_type
        description: "Part type description"
      - name: brand
        description: "Part brand"
      - name: supplier_id
        description: "Foreign key to supplier"
      - name: supplier_name
        description: "Supplier name"
      - name: supplier_nation
        description: "Nation the supplier belongs to"
      - name: quantity
        description: "Quantity ordered"
      - name: extended_price
        description: "Extended price before discount"
      - name: discount
        description: "Discount rate applied (0.0 to 1.0)"
      - name: discounted_price
        description: "extended_price * (1 - discount)"
        tests:
          - not_null
      - name: net_price
        description: "discounted_price * (1 + tax) â€” final price including tax"
        tests:
          - not_null
      - name: is_returned
        description: "True when return_flag = R"
      - name: is_late_shipment
        description: "True when ship_date > commit_date"
      - name: ship_date
        description: "Date the item was shipped"
      - name: ship_mode
        description: "Shipping mode"
