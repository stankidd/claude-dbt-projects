name: mammoth_test
version: '1.0.0'
config-version: 2
profile: 'mammoth_test'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  mammoth_test:
    tpch_sf1000:
      bronze:
        +materialized: view
        +tags: ['bronze', 'tpch_sf1000']
        +schema: tpch_sf1000_bronze
      silver:
        +materialized: table
        +tags: ['silver', 'tpch_sf1000']
        +schema: tpch_sf1000_silver
      gold:
        +materialized: table
        +tags: ['gold', 'tpch_sf1000']
        +schema: tpch_sf1000_gold
    tpch_sf10:
      bronze:
        +materialized: view
        +tags: ['bronze', 'tpch_sf10']
        +schema: tpch_sf10_bronze
      silver:
        +materialized: table
        +tags: ['silver', 'tpch_sf10']
        +schema: tpch_sf10_silver
      gold:
        +materialized: table
        +tags: ['gold', 'tpch_sf10']
        +schema: tpch_sf10_gold
    pharma_sales:
      bronze:
        +materialized: view
        +tags: ['bronze', 'pharma_sales']
        +schema: pharma_sales_bronze
      silver:
        +materialized: table
        +tags: ['silver', 'pharma_sales']
        +schema: pharma_sales_silver
      gold:
        +materialized: table
        +tags: ['gold', 'pharma_sales']
        +schema: pharma_sales_gold
    bikeshare:
      bronze:
        +materialized: view
        +tags: ['bronze', 'bikeshare']
      silver:
        +materialized: table
        +tags: ['silver', 'bikeshare']
      gold:
        +materialized: table
        +tags: ['gold', 'bikeshare']

seeds:
  mammoth_test:
    pharma_sales:
      +schema: pharma_sales_seeds
      +quote_columns: false

dbt-cloud:
  project-id: "70403103999640"
